name: HealthRec Search Relevance Benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5,<3"
      - name: Install data preparation, Elasticsearch and benchmark requirements
        run: |
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<4" "scipy>=1.12,<2" "pyarrow>=17,<30" "pyyaml>=6,<7" "elasticsearch>=8.19,<9" "pytest>=8,<10"
      - name: Prepare temporal train/validation/test split (bundled Food.com sample)
        env:
          HEALTHREC_DATA_CONFIG: data_sample
        run: python scripts/prepare_data.py
      - name: Train original BPR-MF architecture from sample TRAIN interactions
        env:
          HEALTHREC_DATA_CONFIG: data_sample
          HEALTHREC_OUTPUTS: outputs_search_bench
        run: >
          python scripts/train.py --name sample_bpr --set
          train.dim=32 train.max_epochs=20 train.eval_every=2
          train.patience=3 train.batch_size=1024 train.item_bias=true
      - name: Execute real Elasticsearch + BPR sample ranking benchmark
        env:
          ELASTICSEARCH_URL: http://127.0.0.1:9200
        run: python -m scripts.benchmark_search --users 60 --candidate-size 100 --out outputs/search_benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healthrec-search-benchmark
          path: |
            outputs/search_benchmark/metrics.json
            outputs/search_benchmark/results.md
          if-no-files-found: warn
