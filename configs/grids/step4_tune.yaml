  - {name: t_bpr_d32_reg1e-2, set: [train.dim=32, train.reg=1.0e-2]}
  - {name: t_bpr_d32_reg3e-2, set: [train.dim=32, train.reg=3.0e-2]}
  - {name: t_bpr_d64_reg1e-4, set: [train.dim=64, train.reg=1.0e-4]}
  - {name: t_bpr_d64_reg1e-3, set: [train.dim=64, train.reg=1.0e-3]}
  - {name: t_bpr_d64_reg1e-2, set: [train.dim=64, train.reg=1.0e-2]}
  - {name: t_bpr_d64_reg3e-2, set: [train.dim=64, train.reg=3.0e-2]}
  - {name: t_hA_d32_reg1e-4, set: [train.dim=32, train.reg=1.0e-4, health.use_features=true]}
