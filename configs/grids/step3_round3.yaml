# Step 3, round 3: all models with item bias (fixes BPR-MF losing to MostPop)
common: [threads=2, train.eval_every=2, train.patience=4, train.item_bias=true, train.lr=0.002]
runs:
  - {name: b_bpr_d32,        set: [train.dim=32]}
  - {name: b_bpr_d32_reg1e-4, set: [train.dim=32, train.reg=1.0e-4]}
  - {name: b_hA_d32,         set: [train.dim=32, health.use_features=true]}
  - {name: b_hAB_l0.1_d32,   set: [train.dim=32, health.use_features=true, health.lambda_h=0.1]}
  - {name: b_hAB_l0.3_d32,   set: [train.dim=32, health.use_features=true, health.lambda_h=0.3]}
  - {name: b_hAB_l1_d32,   set: [train.dim=32, health.use_features=true, health.lambda_h=1]}
  - {name: b_hAB_l3_d32,   set: [train.dim=32, health.use_features=true, health.lambda_h=3]}
  - {name: b_bpr_d64,        set: [train.dim=64]}
  - {name: b_bpr_d64_reg1e-4, set: [train.dim=64, train.reg=1.0e-4]}
  - {name: b_hA_d64,         set: [train.dim=64, health.use_features=true]}
  - {name: b_hAB_l0.1_d64,   set: [train.dim=64, health.use_features=true, health.lambda_h=0.1]}
  - {name: b_hAB_l0.3_d64,   set: [train.dim=64, health.use_features=true, health.lambda_h=0.3]}
  - {name: b_hAB_l1_d64,   set: [train.dim=64, health.use_features=true, health.lambda_h=1]}
  - {name: b_hAB_l3_d64,   set: [train.dim=64, health.use_features=true, health.lambda_h=3]}
