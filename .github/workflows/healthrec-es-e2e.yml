name: HealthRec Elasticsearch E2E

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  search-integration:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only the dependencies required for live search/MCP
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r prototype_elasticsearch/requirements-es.txt "numpy>=1.26,<3" "pandas>=2.2,<4" "pyyaml>=6,<7" "mcp>=1.25,<2" "langchain-mcp-adapters>=0.1,<1" "langchain>=1,<2" "langgraph>=1,<2" "langchain-openai>=1,<2"
      - name: Run original search tests and adapter contract tests
        run: python -m pytest -q prototype_elasticsearch/tests tests/test_search_backend.py tests/test_fact_checker.py tests/test_health_provenance.py
      - name: Run real Elasticsearch, API, MCP and deterministic LangGraph end-to-end tests
        env:
          ELASTICSEARCH_URL: http://127.0.0.1:9200
        run: python -m pytest -q -m live_es tests/test_elasticsearch_mcp_e2e.py
